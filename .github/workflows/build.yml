name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Run by hand from the Actions tab; "release" publishes the current version.
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release for the version in CMakeLists.txt
        type: boolean
        default: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config ffmpeg libmpv-dev \
            qt6-base-dev qt6-declarative-dev libgl-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install packaging tools
        run: |
          sudo apt-get install -y qmake6 qt6-declarative-dev-tools qt6-wayland \
            qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs qml6-module-qtquick-layouts qml6-module-qtquick-shapes \
            qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qt-labs-folderlistmodel \
            qml6-module-qtcore
      - name: Package AppImage
        run: |
          version=$(sed -n 's/^project(mxcut VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          bash .github/scripts/package-appimage.sh build "$version" dist
      - uses: actions/upload-artifact@v4
        with:
          name: mxCut-linux-appimage
          path: dist/*.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-nsis
            zip
      - name: Build
        run: |
          # Raw logs are not always reachable, so surface compiler errors as annotations.
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee build.log \
            && cmake --build build 2>&1 | tee -a build.log \
            || { grep -iE -A4 "error|fatal" build.log | head -40 | sed 's/^/::error::/'; exit 1; }
      - name: Test
        run: |
          # Surface failing checks as annotations, since raw logs are not always reachable.
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee test.log \
            || { # Re-run failing tests with QtTest's report in a file, as console output can go missing,
                 # and post each report as one annotation (newlines encoded as %0A).
                 for t in $(sed -n 's/^.*[0-9] - \(tst_[a-z_]*\) .*$/\1/p' test.log); do
                   exe=$(find build -name "$t.exe" | head -1)
                   code=0; "$exe" -o report.txt,txt -o -,txt > console.txt 2>&1 || code=$?
                   { echo "$exe exited with $code"; ldd "$exe" | grep -vi "/c/windows" || true
                     cat report.txt console.txt 2>/dev/null | grep -vE '^(PASS|Config|Totals)' | head -60; } > diag.txt
                   echo "::error::$(tr -d '\r' < diag.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
                 done
                 exit 1; }
      - name: Package
        run: |
          bash .github/scripts/package-windows.sh build dist/mxCut
          version=$(sed -n 's/^project(mxcut VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          makensis -V2 -DVERSION="$version" -DDIST="$(cygpath -w "$PWD/dist/mxCut")" \
            -DOUTFILE="$(cygpath -w "$PWD/dist/mxCut-$version-setup.exe")" packaging/windows/installer.nsi
          (cd dist && zip -qr "mxCut-$version-windows-x64.zip" mxCut)
      - name: Check the packaged app starts
        run: |
          # Run it from a folder outside MSYS2 so it can only use what we ship.
          cp -r dist/mxCut "$RUNNER_TEMP/startup-check"
          PATH=/c/Windows/system32:/c/Windows /usr/bin/timeout 120 "$RUNNER_TEMP/startup-check/mxcut.exe" --check-startup
      - uses: actions/upload-artifact@v4
        with:
          name: mxCut-windows-x64
          path: |
            dist/*-setup.exe
            dist/*.zip

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix build -L

  # A pushed tag like v0.2.0, or a manual run with "release" ticked, publishes a
  # GitHub release with the installers.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [linux, windows, nix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check the versions match
        run: |
          version=$(sed -n 's/^project(mxcut VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "${GITHUB_REF_NAME#v}" = "$version" ] \
              || { echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in CMakeLists.txt"; exit 1; }
          fi
          grep -q "version = \"$version\";" flake.nix \
            || { echo "::error::flake.nix has a different version from CMakeLists.txt ($version)"; exit 1; }
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creates the tag at this commit when the run wasn't started by one.
          gh release create "$TAG" --target "$GITHUB_SHA" --title "mxCut ${TAG#v}" \
            --generate-notes artifacts/*
